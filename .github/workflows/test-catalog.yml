name: Test Catalog

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "43 4 * * 1"

permissions:
  contents: read

jobs:
  test-catalog:
    runs-on: ubuntu-latest
    container: golang:1.24-bookworm
    services:
      polaris:
        image: apache/polaris:latest
        env:
          POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,root,s3cr3t
        ports:
          - 8181:8181
    env:
      POLARIS_ENDPOINT: http://polaris:8181/api/management/v1
      POLARIS_REALM: POLARIS
      POLARIS_ROOT_CLIENT_ID: root
      POLARIS_ROOT_CLIENT_SECRET: s3cr3t
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: apt-get update && apt-get install -y --no-install-recommends curl jq unzip ca-certificates
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: go mod download
      - run: make generate fmt test build
      - run: scripts/test_catalog.sh
